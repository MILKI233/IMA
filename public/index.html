<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אמא במשמרת · ניהול משימות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="inventory.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ מסך כניסה ============ -->
  <div id="login-screen" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-crest">◆</div>
      <div class="login-title">אמא במשמרת</div>
      <div class="login-sub">מערכת ניהול משימות</div>
      <div id="login-hebdate" class="login-hebdate"></div>
      <input id="login-code" type="password" inputmode="numeric" placeholder="קוד עובדת" autocomplete="off">
      <button id="login-btn" class="btn-primary btn-block">כניסה למשמרת</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </div>

  <!-- ============ אפליקציה ============ -->
  <div id="app" class="app-shell hidden">

    <aside class="sidebar">
      <div class="side-brand">
        <div class="side-crest">◆</div>
        <div>
          <div class="side-name">אמא במשמרת</div>
          <div class="side-tag">ניהול משימות</div>
        </div>
      </div>

      <nav class="side-nav" id="side-nav"><!-- נבנה דינמית לפי הרשאות --></nav>

      <div class="side-foot">
        <div class="side-user">
          <div class="su-avatar" id="su-avatar">?</div>
          <div class="su-info">
            <div class="su-name" id="user-name"></div>
            <div class="su-role" id="user-role"></div>
          </div>
          <button class="su-logout" id="logout-btn" title="סיום משמרת">⏻</button>
        </div>
      </div>
    </aside>

    <div class="content">
      <header class="topbar">
        <div class="tb-title">
          <h1 id="page-title">משימות היום</h1>
          <div id="heb-context" class="tb-context"></div>
        </div>
        <div class="tb-tools"></div>
      </header>
      <div id="announce-banner"></div>
      <main id="main" class="main-area"></main>
    </div>
  </div>

  <div id="toast-host" class="toast-host"></div>
  <!-- שומר מסך: מונע תקיעה של שכבות מודאל יתומות (חייב להיטען לפני קוד המערכת) -->
  <script src="session.js"></script>
  <script src="ui-guard.js"></script>
  <script src="app.js"></script>
</body>
</html>
